<!doctype html>
<!-- Source for public/og-image.png (1200x630 social preview). Regenerate: open in a browser at 1200x630 and screenshot #card. See DEVLOG Step 8. -->
<html>
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=IBM+Plex+Mono:wght@500&family=Inter:wght@500&display=block"
    />
    <style>
      html,
      body {
        margin: 0;
        background: #05060d;
      }
      #card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        box-sizing: border-box;
        padding: 72px 80px;
        color: #eceef6;
        font-family: Inter, system-ui, sans-serif;
        background:
          radial-gradient(42% 60% at 82% 28%, rgb(10 130 140 / 0.55), transparent 70%),
          radial-gradient(48% 62% at 18% 16%, rgb(70 42 160 / 0.6), transparent 70%),
          radial-gradient(40% 55% at 70% 100%, rgb(150 32 118 / 0.45), transparent 70%), #05060d;
      }
      .stars {
        position: absolute;
        inset: 0;
      }
      .stars i {
        position: absolute;
        width: 2px;
        height: 2px;
        border-radius: 50%;
        background: #cfe9ff;
      }
      .eyebrow {
        font:
          500 22px/1 'IBM Plex Mono',
          monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #7cf0d4;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .eyebrow b {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #7cf0d4;
        box-shadow: 0 0 18px #7cf0d4;
      }
      h1 {
        margin: 34px 0 0;
        font:
          800 104px/0.94 'Bricolage Grotesque',
          sans-serif;
        letter-spacing: -0.045em;
      }
      h1 span {
        color: #7cf0d4;
      }
      p {
        margin: 30px 0 0;
        font-size: 32px;
        line-height: 1.3;
        color: #c9cee0;
        max-width: 900px;
      }
      .foot {
        position: absolute;
        left: 80px;
        right: 80px;
        bottom: 64px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font:
          500 24px/1 'IBM Plex Mono',
          monospace;
        color: #a3a9bd;
      }
      .pill {
        padding: 14px 24px;
        border-radius: 999px;
        background: #7cf0d4;
        color: #04211b;
        font-family: Inter, sans-serif;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="card">
      <div class="stars" id="stars"></div>
      <div class="eyebrow"><b></b>Developer &amp; Project Manager · Calabar, Nigeria</div>
      <h1>Emmanuel<br />Asukwo Ndem<span>.</span></h1>
      <p>I turn software requirements into clean, working web applications.</p>
      <div class="foot">
        <span>github.com/metalpadawan</span
        ><span class="pill">Every project · live from GitHub</span>
      </div>
    </div>
    <script>
      // Deterministic star field (seeded) so re-renders are identical.
      let s = 7;
      const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
      const box = document.getElementById('stars');
      for (let i = 0; i < 140; i++) {
        const d = document.createElement('i');
        d.style.left = r() * 100 + '%';
        d.style.top = r() * 100 + '%';
        d.style.opacity = (0.15 + r() * 0.7).toFixed(2);
        const z = r() > 0.92 ? 3 : 2;
        d.style.width = d.style.height = z + 'px';
        box.appendChild(d);
      }
    </script>
  </body>
</html>
